<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="hero-title hero-desc" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title id="hero-title">AI Content &amp; SEO Automation Platform</title>
  <desc id="hero-desc">Animated hero banner: gradient title, self-typing tagline, floating orbs and a technology chip row.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#141a33"/>
    </linearGradient>
    <linearGradient id="titleGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.25" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="0.75" stop-color="#34d399"/>
      <stop offset="1" stop-color="#7c3aed"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1200 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="orbViolet"><stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbCyan"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.45"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbPink"><stop offset="0" stop-color="#f472b6" stop-opacity="0.35"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <linearGradient id="fadeTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b1020" stop-opacity="0.9"/>
    </linearGradient>
    <clipPath id="typeClip">
      <rect x="190" y="196" width="0" height="40">
        <animate attributeName="width" calcMode="discrete" begin="1.1s" dur="3.4s" fill="freeze"
          values="0;41;82;123;164;205;246;287;328;369;410;451;492;533;574;615;656;697;738;779;820"/>
      </rect>
    </clipPath>
    <style>
      .chip { opacity: 0; animation: fadeUp .7s cubic-bezier(.2,.7,.2,1) forwards; }
      .chip.c1 { animation-delay: 4.6s }
      .chip.c2 { animation-delay: 4.8s }
      .chip.c3 { animation-delay: 5.0s }
      .chip.c4 { animation-delay: 5.2s }
      .chip.c5 { animation-delay: 5.4s }
      .dot { opacity: 0; animation: fadeUp .5s ease-out forwards; }
      .dot.d1 { animation-delay: 4.7s } .dot.d2 { animation-delay: 4.9s }
      .dot.d3 { animation-delay: 5.1s } .dot.d4 { animation-delay: 5.3s }
      .badge { opacity: 0; animation: fadeUp .8s ease-out .3s forwards; }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
  </defs>

  <!-- background -->
  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- floating orbs -->
  <circle cx="200" cy="90" r="170" fill="url(#orbViolet)">
    <animate attributeName="cx" values="200;300;200" dur="16s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
    <animate attributeName="cy" values="90;150;90" dur="19s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
  </circle>
  <circle cx="1000" cy="300" r="190" fill="url(#orbCyan)">
    <animate attributeName="cx" values="1000;880;1000" dur="21s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
    <animate attributeName="cy" values="300;220;300" dur="17s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
  </circle>
  <circle cx="640" cy="20" r="150" fill="url(#orbPink)">
    <animate attributeName="cx" values="640;560;640" dur="23s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
    <animate attributeName="cy" values="20;70;20" dur="15s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
  </circle>
  <rect y="260" width="1200" height="100" fill="url(#fadeTop)"/>

  <!-- version badge -->
  <g class="badge">
    <rect x="40" y="32" width="196" height="26" rx="13" fill="#0b1020" fill-opacity="0.7" stroke="#34d399" stroke-opacity="0.6"/>
    <circle cx="56" cy="45" r="4" fill="#34d399">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="68" y="49" font-size="12" font-weight="600" fill="#a7f3d0" letter-spacing="0.4">v0.1.0 · Phase 1 shipped</text>
  </g>

  <!-- title -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.9s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="0.2s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.2 1"/>
    <text x="600" y="152" text-anchor="middle" font-size="50" font-weight="800" letter-spacing="-1" fill="url(#titleGrad)" textLength="930" lengthAdjust="spacingAndGlyphs">AI Content &amp; SEO Automation Platform</text>
  </g>

  <!-- typing tagline -->
  <g clip-path="url(#typeClip)">
    <text x="600" y="224" text-anchor="middle" font-size="18" fill="#cbd5e1" textLength="820" lengthAdjust="spacing">From topic to published, measured content — AI does the repetitive work, humans keep control.</text>
  </g>
  <rect x="190" y="208" width="2.5" height="22" fill="#22d3ee" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.1s" fill="freeze"/>
    <animate attributeName="x" calcMode="discrete" begin="1.1s" dur="3.4s" fill="freeze"
      values="190;231;272;313;354;395;436;477;518;559;600;641;682;723;764;805;846;887;928;969;1010"/>
    <animate attributeName="fill-opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" begin="1.0s" repeatCount="indefinite"/>
  </rect>

  <!-- chip row -->
  <g font-size="13" font-weight="600" text-anchor="middle">
    <g class="chip c1">
      <rect x="268" y="272" width="120" height="34" rx="17" fill="#121a30" stroke="#2a3555"/>
      <circle cx="288" cy="289" r="4" fill="#ffffff"/>
      <text x="334" y="294" fill="#e2e8f0">Next.js</text>
    </g>
    <circle class="dot d1" cx="396" cy="289" r="2" fill="#475569"/>
    <g class="chip c2">
      <rect x="404" y="272" width="120" height="34" rx="17" fill="#121a30" stroke="#2a3555"/>
      <circle cx="424" cy="289" r="4" fill="#e0234e"/>
      <text x="470" y="294" fill="#e2e8f0">NestJS</text>
    </g>
    <circle class="dot d2" cx="532" cy="289" r="2" fill="#475569"/>
    <g class="chip c3">
      <rect x="540" y="272" width="120" height="34" rx="17" fill="#121a30" stroke="#2a3555"/>
      <circle cx="560" cy="289" r="4" fill="#5a67d8"/>
      <text x="606" y="294" fill="#e2e8f0">Prisma</text>
    </g>
    <circle class="dot d3" cx="668" cy="289" r="2" fill="#475569"/>
    <g class="chip c4">
      <rect x="676" y="272" width="120" height="34" rx="17" fill="#121a30" stroke="#2a3555"/>
      <circle cx="696" cy="289" r="4" fill="#f59e0b"/>
      <text x="742" y="294" fill="#e2e8f0">BullMQ</text>
    </g>
    <circle class="dot d4" cx="804" cy="289" r="2" fill="#475569"/>
    <g class="chip c5">
      <rect x="812" y="272" width="120" height="34" rx="17" fill="#121a30" stroke="#2a3555"/>
      <circle cx="832" cy="289" r="4" fill="#34d399"/>
      <text x="878" y="294" fill="#e2e8f0">OpenAI</text>
    </g>
  </g>

  <!-- bottom strip -->
  <text x="600" y="340" text-anchor="middle" font-size="11" fill="#64748b" letter-spacing="1.5">MULTI-TENANT · TYPESCRIPT · TURBOREPO · DOCKER</text>
</svg>

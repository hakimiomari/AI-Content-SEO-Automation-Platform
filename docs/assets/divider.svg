<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 40" width="1200" height="40" role="img" aria-label="Animated gradient wave divider" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#141a33"/>
    </linearGradient>
    <linearGradient id="wave" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.33" stop-color="#22d3ee"/>
      <stop offset="0.66" stop-color="#34d399"/>
      <stop offset="1" stop-color="#7c3aed"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1200 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b1020" stop-opacity="1"/>
      <stop offset="0.08" stop-color="#0b1020" stop-opacity="0"/>
      <stop offset="0.92" stop-color="#141a33" stop-opacity="0"/>
      <stop offset="1" stop-color="#141a33" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="40" fill="url(#bg)"/>
  <g fill="none" stroke-linecap="round">
    <path stroke="url(#wave)" stroke-width="2.5" stroke-opacity="0.9"
      d="M-400,20 Q-350,6 -300,20 T-200,20 T-100,20 T0,20 T100,20 T200,20 T300,20 T400,20 T500,20 T600,20 T700,20 T800,20 T900,20 T1000,20 T1100,20 T1200,20 T1300,20 T1400,20 T1500,20 T1600,20">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="200 0" dur="4s" repeatCount="indefinite"/>
    </path>
    <path stroke="url(#wave)" stroke-width="1.5" stroke-opacity="0.45"
      d="M-400,20 Q-350,32 -300,20 T-200,20 T-100,20 T0,20 T100,20 T200,20 T300,20 T400,20 T500,20 T600,20 T700,20 T800,20 T900,20 T1000,20 T1100,20 T1200,20 T1300,20 T1400,20 T1500,20 T1600,20">
      <animateTransform attributeName="transform" type="translate" from="200 0" to="0 0" dur="6s" repeatCount="indefinite"/>
    </path>
    <path stroke="#ffffff" stroke-width="1" stroke-opacity="0.08"
      d="M-400,20 Q-350,12 -300,20 T-200,20 T-100,20 T0,20 T100,20 T200,20 T300,20 T400,20 T500,20 T600,20 T700,20 T800,20 T900,20 T1000,20 T1100,20 T1200,20 T1300,20 T1400,20 T1500,20 T1600,20">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="200 0" dur="9s" repeatCount="indefinite"/>
    </path>
  </g>
  <rect width="1200" height="40" fill="url(#edge)"/>
</svg>

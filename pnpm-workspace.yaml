packages:
  - 'apps/*'
  - 'packages/*'

# pnpm >= 10 blocks dependency lifecycle scripts unless explicitly allowed.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  esbuild: true
  sharp: true
  '@tailwindcss/oxide': true
  unrs-resolver: true
  '@parcel/watcher': true
  msgpackr-extract: true
  '@scarf/scarf': false
  '@nestjs/core': false

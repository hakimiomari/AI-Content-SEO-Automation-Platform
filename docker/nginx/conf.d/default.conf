upstream web_upstream {
    server web:3000;
    keepalive 32;
}

upstream api_upstream {
    server api:4000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ── Security headers ──
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-XSS-Protection          "0" always;
    # Enable once everything is served over HTTPS:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # nginx self health (used by the compose healthcheck)
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # ACME challenge for Let's Encrypt (certbot webroot)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # ── Auth endpoints: tight rate limit ──
    location ^~ /api/v1/auth {
        limit_req zone=auth_zone burst=20 nodelay;
        proxy_pass http://api_upstream;
    }

    # ── API (prefix kept: NestJS uses global prefix /api/v1; Swagger at /api/docs) ──
    location /api/ {
        limit_req zone=api_zone burst=60 nodelay;
        proxy_pass http://api_upstream;
    }

    # ── Next.js static assets: cache aggressively (content-hashed) ──
    location ^~ /_next/static/ {
        proxy_pass http://web_upstream;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Next.js HMR / RSC streaming (dev only, harmless in prod) ──
    location ^~ /_next/webpack-hmr {
        proxy_pass http://web_upstream;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ── Everything else → Next.js ──
    location / {
        proxy_pass http://web_upstream;
        proxy_buffering off; # RSC / streaming responses
    }
}

